<div th:fragment="passengerTable" class="d-block" xmlns:th="http://www.w3.org/1999/xhtml" data-hideable="hiddeable" data-tab="notificationsTab">
    <h2 th:text="#{transportCRUD.transportsForPassengerTableTitle}" class="mt-2 mb-4"></h2>

    <table class="table table-striped table-bordered shadow-lg" id="passengerNotificationsTable" width="100%" cellspacing="0">
        <thead class="bg-light">
        <!-- Event Name row -->
        <tr>
            <th></th>
            <th th:each="dateObj : ${templateDates}"
                th:text="${dateObj.eventName}"
                class="text-nowrap"></th>
        </tr>
        <!-- Event Name row -->

        <!-- Days of the week row -->
        <tr>
            <th></th>
            <th th:each="dateObj : ${templateDates}"
                th:with="date=${dateObj.transportDateByTemplate}"
                th:data-date="${date.transportDate}"
                th:data-date-id="${date.id}"
                th:text="${#messages.msgOrNull(dateObj.dayOfTheWeekName) + ' ' + date.transportDate.toString().substring(8)}"
                class="text-nowrap"
            ></th>
        </tr>
        <!-- Days of the week row -->
        </thead>
        <tbody>
            <tr th:each="passengerObj : ${passengerNotificationsTableInfo}"
                th:with="passenger=${passengerObj.passenger}"
                th:data-passenger:="${passenger.id}" 
                th:id="'passenger_row_' + ${passenger.id}">

                <!-- Passenger Name cell -->
                <td
                        th:id="${passenger.id} + '_th'"
                        th:data-passenger-id="${passenger.id}"
                        class="text-nowrap text-left"
                >
                    <!-- Passenger Name -->
                    <div class="row mt-1">
                        <div class="col">
                            <span th:text="${passenger.name} + ' ' + ${passenger.surname}"></span>
                        </div>
                    </div>
                    <!-- Passenger Name -->

                </td>
                <!-- Passenger Name cell -->
    
                <!-- Passenger Data -->
                <td th:each="dateObj : ${templateDates}"
                    th:with="date=${dateObj.transportDateByTemplate}, passengerScreenInfo=${passengerObj.passengerInfoMap.get(date.id)}"
                    th:data-date-id="${date.id}"
                    th:id="'d' + ${passenger.id} + 't' + ${date.id} + '_date_td'"
                    th:class="'text-nowrap' + ${(dateObj.dateType != 'transportDate') ? ' text-center' : ''}"
                >
                    <!-- Event display -->
                    <span th:if="${(dateObj.dateType == 'event')}" class="text-danger">------------</span>
    
                    <!-- Transport Date display -->
                    <div th:unless="${'event' == dateObj.dateType}" class="d-flex flex-column">
                        <!-- Driver name -->
                        <span th:text="${(passengerScreenInfo.notifiedDriverName != null) ? passengerScreenInfo.notifiedDriverName : ''}"></span>
                    </div>
                    <!-- Transport Date display -->
                </td>
            </tr>
        </tbody>
    </table>
</div>
