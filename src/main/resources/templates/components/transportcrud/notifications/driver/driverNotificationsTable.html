<!-- Drivers table -->
<div th:fragment="driverTable" class="d-block" xmlns:th="http://www.w3.org/1999/xhtml" data-hideable="hiddeable" data-tab="notificationsTab">
    <h2 th:text="#{transportCRUD.transportsForDriversTableTitle}" class="mt-5 mb-4"></h2>

    <table class="table table-striped table-bordered shadow-lg" id="driverNotificationsTable" width="100%" cellspacing="0">
        <thead class="bg-light">
            <!-- Event Name row -->
            <tr>
                <th></th>
                <th th:each="dateObj: ${templateDates}"
                    th:text="${dateObj.eventName}"
                    class="text-nowrap"></th>
            </tr>
            <!-- Event Name row -->

            <!-- Days of the week row -->
            <tr>
                <th></th>
                <th th:each="dateObj: ${templateDates}"
                    th:with="date=${dateObj.transportDateByTemplate}"
                    th:data-date="${date.transportDate}"
                    th:data-date-id="${date.id}"
                    th:text="${#messages.msgOrNull(dateObj.dayOfTheWeekName) + ' ' + date.transportDate.toString().substring(8)}"
                    class="text-nowrap"
                ></th>
            </tr>
            <!-- Days of the week row -->
        </thead>
        <tbody>
            <tr th:each="driverObj : ${driverNotificationsTableInfo}" 
                th:with="driver=${driverObj.driver}"
                th:data-driver:="${driver.id}" 
                th:id="'driver_row_' + ${driver.id}">
                <!-- Driver Name cell -->
                <td
                        th:id="${driver.id} + '_th'"
                        th:data-driver-id="${driver.id}"
                        class="text-nowrap text-left"
                >
                    <div class="row mt-1">
                        <div class="col">
                            <span th:text="${driver.name} + ' ' + ${driver.surname}"></span>
                        </div>
                    </div>
                </td>
                <!-- Driver Name cell -->

                <!-- Driver Data cell -->
                <td th:each="dateObj : ${templateDates}"
                    th:with="date=${dateObj.transportDateByTemplate}, driverScreenInfo=${driverObj.driverInfoMap.get(date.id)}"
                    th:data-date-id="${date.id}"
                    th:id="'d' + ${driver.id} + 't' + ${date.id} + '_date_td'"
                    th:class="'text-nowrap' + ${(dateObj.dateType != 'transportDate') ? ' text-center' : ''}"
                >
                    <!-- Event display -->
                    <span th:if="${(dateObj.dateType == 'event')}" class="text-danger">------------</span>

                    <!-- Transport Date display -->
                    <div th:unless="${'event' == dateObj.dateType}" class="d-flex flex-column">

                        <!-- Div to show drivers assigned to transport on current date -->
                        <div class="row h-75 mt-1 ml-0">
                            <div class="col" th:id="'driverPassengersNotificationsForDateDiv_' + ${driver.id} + '_' + ${date.id}"
                                 th:if="${!driverScreenInfo.notifiedPassengerNameList.isEmpty()}">

                                <div class="row"
                                     th:each="passenger : ${driverScreenInfo.notifiedPassengerNameList}"
                                     th:id="'driverPassengersNotificationsOnDate_' + ${driver.id} + '_' + ${date.id} + '_' + ${passenger}"
                                >
                                    <span th:text="${passenger}"></span>
                                </div>
                            </div>
                        </div>
                        <!-- Div to show passengers assigned to transport on current date -->

                    </div>
                    <!-- Transport Date display -->
                </td>
            </tr>
        </tbody>
    </table>
</div>
