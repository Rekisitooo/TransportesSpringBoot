<div th:fragment="passengerTable" class="d-block" xmlns:th="http://www.w3.org/1999/xhtml" data-hideable="hiddeable" data-tab="transportsTab">
    <h2 th:text="#{transportCRUD.transportsForPassengerTableTitle}" class="mt-2 mb-2"></h2>
    <th:block th:insert="~{components/transportcrud/transports/passenger/showPassengerTablesEditIcons :: showPassengerIconsCheckbox}">  </th:block>

    <table class="table table-striped table-bordered shadow-lg w-100" id="passengerTransportsTable">
        <thead class="bg-light">

            <!-- Event Name row -->
            <tr>
                <th th:data-date="${templateYear} + '-' + ${monthNumber} + '-' + '00'" class="text-nowrap"></th>
                <th th:each="dateObj: ${templateDates}" th:with="date=${dateObj.transportDateByTemplate}" th:data-date="${date.transportDate}" th:text="${date.eventName}" class="text-nowrap"></th>
            </tr>

            <!-- Days of the week row -->
            <tr>
                <!-- empty for the passengers column -->
                <th th:data-date="${templateYear} + '-' + ${monthNumber} + '-' + '00'" class="text-nowrap"></th>
                <th th:each="dateObj: ${templateDates}"
                    th:with="date=${dateObj.transportDateByTemplate}"
                    th:data-date="${date.transportDate}"
                    name="monthDate"
                    class="text-nowrap"
                >
                    <span th:text="${#messages.msgOrNull(dateObj.dayOfTheWeekName) + ' ' + date.transportDate.toString().substring(8)}"></span>
                        <i class="fas fa-trash text-danger" role="button" data-name="date-delete-icon" data-passenger-showable-icon="data-passenger-showable-icon"
                           th:data-a="${(dateObj.dateType == 'transportDate') ? date.id : ''}"
                           th:data-b="${(dateObj.dateType == 'event') ? date.id : ''}"
                        ></i>
                </th>
            </tr>

        </thead>
        <tbody>
            <tr th:each="passengerObj : ${passengerTransportsTableInfo}" 
                th:id="'passenger_row_' + ${passenger.id}" 
                th:with="passenger=${passengerObj.passenger},
                         generalPassengerIcons=${passengerObj.voScreenGeneralPassengerIcon},
                         passengerInfoMap=${passengerObj.passengerInfoMap}"
                class="" >

                <!-- Passenger name -->
                <td
                    th:id="'passengerNameCell_' + ${passenger.id}"
                    th:data-t="${passenger.id}"
                    th:data-date="${templateYear} + '-' + ${monthNumber} + '-' + '00'"
                    class="text-nowrap text-left"
                    style="cursor:move"
                    draggable="true"
                    data-draggable="involvedTable"
                >
                    <!-- Passenger buttons row -->
                    <div th:class="'d-flex flex-column row ' + ${(generalPassengerIcons.showIcons) ? '' : 'd-none'}">
                        <div class="col" data-passenger-showable-icon="data-passenger-showable-icon">

                            <!-- Notification icon -->
                            <div class="row">
                                <div th:class="'col' + ${(generalPassengerIcons.voNotificationIconDisplay.showIcon) ? '' : 'd-none'}"
                                        th:id="'markAsNotifiedPassengerButtonDiv_' + ${passenger.id}">
                                    <i th:class="
                                            'fas fa-exclamation-circle ' +
                                            ${(generalPassengerIcons.voNotificationIconDisplay.iconColor.equals('red')) ? 'text-danger' : 'text-primary'}"
                                       role="button"
                                       th:title="#{transportCRUD.titleMarkNotificationStart} + ' ' + ${passenger.name} + ' ' + ${passenger.surname} + ' ' + #{transportCRUD.titleMarkAllNotificationsEnd}"
                                       th:id="'markAsNotifiedPassegerButton_' + ${passenger.id}"
                                    ></i>
                                </div>
                            </div>
                            <!-- Notification icon -->

                        </div>
                    </div>
                    <!-- Passenger buttons row -->

                    <!-- Passenger name row -->
                    <div class="row mt-1">
                        <div class="col">
                            <span
                                    th:text="${passenger.name} + ' ' + ${passenger.surname}"
                                    th:id="${passenger.id} + '_th_passenger_name_span'" >
                            </span>
                        </div>
                    </div>
                    <!-- Passenger name row -->
                </td>

                <!-- Assistance for date -->
                <td th:each="dateObj : ${templateDates}" th:data-date="${dateObj.transportDateByTemplate.transportDate}"
                    th:with="
                            date=${dateObj.transportDateByTemplate},
                            passengerScreenInfo=${passengerInfoMap.get(date.id)},
                            driversAvailableForDate=${passengerScreenInfo.voPassengerTransportDisplay.availableDriverList}"

                    th:class="${((dateObj.dateType == 'event') or (dateObj.dateType == 'transportDate')) ? 'text-center' : ''}"
                    th:id="'p' + ${passenger.id} + 't' + ${date.id} + '_date_td'"
                    th:data-t="${passenger.id}"
                    th:data-date-id="${date.id}"
                    th:data-y="'t' + ${date.id}"
                    th:data-tr-ref="'passenger_row_' + ${passenger.id}"
                    th:data-driver-selector="${'selectDriverForPassenger_' + passenger.id + '_' + date.id + '_select'}"
                    data-passenger-td="data-passenger-td"
                >
                    <!-- Event display -->
                    <span th:if="${(dateObj.dateType == 'event')}">--------</span>
                    <!-- Event display -->

                    <!-- Transport Date display -->
                    <th:block th:if="${(dateObj.dateType == 'transportDate')}">

                        <div class="d-flex flex-column">

                            <!-- Div for buttons to change passenger status on current date -->
                            <div class="row h-25" data-passenger-showable-icon="data-passenger-showable-icon" th:id="${'passenger_icon_row_' + passenger.id}">

                                <!-- Needs Transport div (Show if passenger assists) -->
                                <div
                                    th:id="${'needsTransportIcon_' + passenger.id + '_' + date.id}"
                                    th:class="${(passengerScreenInfo.assistsOnDate) ? 'col-2' : 'col-2 d-none'}">

                                    <!-- Needs Transport icon -->
                                    <i
                                        th:data-t="${passenger.id}"
                                        th:data-y="${date.id}"
                                        th:data-passenger-select="${'selectDriverForPassenger_' + passenger.id + '_' + date.id}"
                                        th:data-needs-transport="${(passengerScreenInfo.needsTransport) ? 1 : 0}"
                                        th:class="'position-relative fas fa-car ' + ${(!passengerScreenInfo.assistsOnDate or passengerScreenInfo.needsTransport) ? 'text-primary' : 'text-muted'}"
                                        th:title="#{transportCRUD.titleCarIconNeedsTransportForDate}"
                                        role="button"
                                        style="top: 0; left: 0; font-size: 1em;"
                                    ></i>
                                    <!-- Needs Transport icon -->
                                </div>
                                <!-- Needs Transport div (Show if passenger assists) -->

                                <!-- Assistance div -->
                                <div class="col-2">

                                    <!-- Assistance icon -->
                                    <i class="fas fa-calendar-check"
                                       th:data-t="${passenger.id}"
                                       th:data-y="${date.id}"
                                       th:data-passenger-select="${'selectDriverForPassenger_' + passenger.id + '_' + date.id}"
                                       th:data-passenger-assist="${(passengerScreenInfo.assistsOnDate) ? 1 : 0}"
                                       th:title="#{transportCRUD.titleCalendarIconPassengerAssistsOnTransportForDate}"
                                       role="button"
                                       th:class="${(passengerScreenInfo.assistsOnDate) ?
                                            'fas fa-calendar-check text-primary' : 'fas fa-calendar-check text-muted'}"
                                    ></i>
                                    <!-- Assistance icon -->
                                </div>
                                <!-- Assistance div -->

                                <!-- Notification icon div -->
                                <div
                                     th:id="${'notificationIcon_' + passenger.id + '_' + date.id}"
                                     th:class="'col-2 ' + ${(passengerScreenInfo.voNotificationIconDisplay.showIcon) ? '' : 'd-none'}">

                                    <!-- Notification icon -->
                                    <i
                                        th:class="'fas fa-exclamation-circle ' +
                                            ${(passengerScreenInfo.voNotificationIconDisplay.iconColor.equals('blue')) ? 'text-primary' : 'text-danger'}"
                                        role="button"
                                        th:title="#{transportCRUD.titleMarkNotificationStart} + ' ' + ${passenger.name} + ' ' + ${passenger.surname} + ' ' + #{transportCRUD.titleMarkNotificationEnd} + ' ' + ${date.transportDate}"
                                        th:data-drivers-selector="${'selectDriverForPassenger_' + passenger.id + '_' + date.id + '_select'}"
                                        th:data-passenger-th="'passengerNameCell_' + ${passenger.id}"
                                        th:data-date-td="'p' + ${passenger.id} + 't' + ${date.id} + '_date_td'"
                                    ></i>
                                   <!-- Notification icon -->
                                </div>
                                <!-- Notification icon div -->

                            </div>
                            <!-- Div for buttons to change passenger status on current date -->

                            <!-- Div for transport info -->
                            <div class="d-table-cell row h-75 mt-2 d-flex justify-content-center align-items-center">
                                <div class="col">
                                    <!-- Drivers select -->
                                    <!-- show only if passenger needs transport -->
                                    <select name="driverInTransportSelect"
                                            th:aria-label="${passenger.name} + ' ' + ${passenger.surname} + ': ' + #{transportCRUD.driverFor} + ' ' + ${dateObj.dayOfTheWeekName} + ' ' + ${date.transportDate}"
                                            class="bg-transparent border border-0"
                                            th:data-t="${passenger.id}"
                                            th:id="${'selectDriverForPassenger_' + passenger.id + '_' + date.id + '_select'}"
                                            th:class="${(passengerScreenInfo.needsTransport and passengerScreenInfo.assistsOnDate) ?
                                                        'bg-transparent border border-0 w-100' : 'bg-transparent border border-0 w-100 d-none'}">

                                        <!-- option for deleting the transport -->
                                        <option selected="selected" name="d" th:data-d="${date.id}" th:data-t="${passenger.id}"></option>

                                        <!-- driver options-->
                                        <option
                                                th:each="driver : ${driversAvailableForDate}"
                                                th:selected="${(passengerScreenInfo.voPassengerTransportDisplay.selectedDriverId == driver.id)}"
                                                th:text="${driver.name}"
                                                th:value="${driver.id}"
                                                th:data-d="${date.id}"
                                                th:data-t="${passenger.id}"
                                                th:data-passenger-name="${passenger.name} + ' ' + ${passenger.surname}"
                                                th:name="${passengerScreenInfo.voPassengerTransportDisplay.selectedDriverId == null}? 'c' : 'u'"
                                        ></option>
                                    </select>

                                    <!-- 'Does not need transport' Span -->
                                    <!-- If passenger does not need transport -->
                                    <span th:id="${'selectDriverForPassenger_' + passenger.id + '_' + date.id + '_doesNotNeedTransportSpan'}"
                                            th:class="${(!passengerScreenInfo.needsTransport and passengerScreenInfo.assistsOnDate) ? ' ' : 'd-none'}"
                                          th:text="#{transportCRUD.doesNotNeedTransport}"></span>

                                    <!-- 'Does not asist' Span -->
                                    <!-- If passenger does not assist on this date -->
                                    <span th:id="${'selectDriverForPassenger_' + passenger.id + '_' + date.id + '_doesNotAssistSpan'}"
                                            th:class="${(passengerScreenInfo.assistsOnDate)? 'd-none' : ' '}"
                                          th:text="#{transportCRUD.doesNotAssist}"></span>
                                </div>

                            </div>
                            <!-- Div for transport info -->

                        </div>
                    </th:block>
                    <!-- Transport Date display -->
                </td>
            </tr>
        </tbody>
    </table>

    <script src="/js/own/transportcrud/passenger/notification/TransportCrudPassengerNotifications.js" type="module"></script>
    <script src="/js/own/transportcrud/passenger/TransportCrudPassengerAvailabilityForDateCRUD.js" type="module"></script>
    <script src="/js/own/transportcrud/passenger/TransportCrudNeedsTransport.js" type="module"></script>
</div>
