<!-- Drivers table -->
<div th:fragment="driverTable" class="d-block" xmlns:th="http://www.w3.org/1999/xhtml" data-hideable="hiddeable" data-tab="transportsTab">
    <h2 th:text="#{transportCRUD.transportsForDriversTableTitle}" class="mt-5 mb-2"></h2>
    <th:block th:insert="~{components/transportcrud/transports/driver/showDriverTablesEditIcons :: showDriverIconsCheckbox}">  </th:block>

    <table class="table table-striped table-bordered shadow-lg" id="driverTransportsTable">
        <thead class="bg-light">

        <!-- Event Name row -->
        <tr>
            <th th:data-date="${templateYear} + '-' + ${monthNumber} + '-' + '00'" class="text-nowrap"></th>
            <th th:each="dateObj: ${templateDates}" th:with="date=${dateObj.transportDateByTemplate}" th:data-date="${dateObj.transportDate}" th:text="${dateObj.eventName}" class="text-nowrap"></th>
        </tr>

        <!-- Days of the week row -->
        <tr>
            <!-- empty for the drivers column -->
            <th th:data-date="${templateYear} + '-' + ${monthNumber} + '-' + '00'" class="text-nowrap"></th>
            <th th:each="dateObj: ${templateDates}"
                th:with="date=${dateObj.transportDateByTemplate}"
                th:data-date="${date.transportDate}"
                th:text="${#messages.msgOrNull(dateObj.dayOfTheWeekName) + ' ' + date.transportDate.toString().substring(8)}"
                class="text-nowrap"
            ></th>
        </tr>

        </thead>
        <tbody>
            <tr th:each="driverObj : ${driverTransportsTableInfo}" 
                th:id="'driver_row_' + ${driver.id}"
                class=""
                th:with="driver=${driverObj.driver},
                        generalDriverIcons=${driverObj.voScreenGeneralDriverIcon},
                        driverInfoMap=${driverObj.driverInfoMap}">

                <!-- Driver Name -->
                <td
                    th:id="${driver.id} + '_th'"
                    th:data-d="${driver.id}"
                    th:data-date="${templateYear} + '-' + ${monthNumber} + '-' + '00'"
                    class="text-nowrap text-left"
                    style="cursor:move"
                    draggable="true"
                    data-draggable="involvedTable"
                >
                    <!-- Driver buttons row -->
                    <div th:class="'d-flex flex-column row ' + ${(generalDriverIcons.showIcons) ? '' : 'd-none'}">
                        <div class="col" data-driver-showable-icon="data-driver-showable-icon">

                           <!--Notification icon -->
                            <div class="row">
                                <div class="col" th:id="'markAsNotifiedDriverButtonDiv_' + ${driver.id}">
                                    <i th:class="'fas fa-exclamation-circle text-danger ' 
                                                    + ${(generalDriverIcons.voNotificationIconDisplay.showIcon) ? '' : 'd-none'}"
                                    role="button"
                                    th:title="#{transportCRUD.titleMarkNotificationStart} + ' ' + ${driver.name} + ' ' + ${driver.surname} + ' ' + #{transportCRUD.titleMarkAllNotificationsEndda}"
                                    th:id="'markAsNotifiedDriverButton_' + ${driver.id}"
                                    ></i>
                                </div>
                            </div>
                            <!--Notification icon -->

                        </div>
                    </div>
                    <!-- Driver buttons row -->

                    <!-- Driver name row -->
                    <div class="row mt-1">
                        <div class="col">
                            <span
                                    th:text="${driver.name} + ' ' + ${driver.surname}"
                                    th:id="${driver.id} + '_th_driver_name_span'" >
                            </span>
                        </div>
                    </div>
                   <!-- Driver name row -->
                </td> 

                <!--  Driver Data -->
                <!-- TODO when UUIDs are implemented, change the id and remove the p and t... -->
                <td th:each="dateObj : ${templateDates}"
                    th:with="date=${dateObj.transportDateByTemplate}, driverScreenInfo=${driverInfoMap.get(date.id)}"
                    th:id="'d' + ${driver.id} + 't' + ${date.id} + '_date_td'"
                    th:data-date="${date.transportDate}"
                    th:data-date-id="${date.id}"
                    th:class="${ ( (dateObj.dateType == 'event') or (dateObj.dateType == 'transportDate')) ? 'text-nowrap text-center' : 'text-nowrap'}"
                    th:data-tr-ref="'driver_row_' + ${driver.id}"
                >

                    <!-- Event display -->
                    <span th:if="${(dateObj.dateType == 'event')}">--------</span>
                    <!-- Event display -->

                    <!-- Transport Date display -->
                    <div th:unless="${'event' == dateObj.dateType}" class="d-flex flex-column">

                    <!-- Div for buttons to change driver status on current date -->
                        <div class="row h-25" data-driver-showable-icon="data-driver-showable-icon" th:id="${'driver_icon_row_' + driver.id}">

                            <!-- Assistance div -->
                            <div class="col-2">

                                <!-- Assistance icon -->
                                <i
                                    th:data-d="${driver.id}"
                                    th:data-y="${date.id}"
                                    th:data-driver-assist="${(driverScreenInfo.providesTransport) ? 1 : 0}"
                                    th:title="#{transportCRUD.titleCalendarIconDriverAssistsOnTransportForDate}"
                                    role="button"
                                    th:class="'fas fa-car ' + ${(driverScreenInfo.providesTransport) ? 'text-primary' : 'text-muted'}"
                                ></i>
                                <!-- Assistance icon -->

                            </div>
                            <!-- Assistance div -->

                            <!-- Notification icon div -->
                            <div th:id="${'notificationIcon_' + driver.id + '_' + date.id}"
                                th:class=" 'col-2 ' + ${(driverScreenInfo.providesTransport) ? '' : 'd-none'}">
                                <!-- Notification icon -->
                                <i
                                    th:class="
                                        'fas fa-exclamation-circle ' +
                                        ${(driverScreenInfo.voNotificationIconDisplay.iconColor == 'blue') ? 'text-primary' : 'text-danger'}"
                                    role="button"
                                    th:title="#{transportCRUD.titleMarkNotificationStart} + ' ' + ${driver.name} + ' ' + ${driver.surname} + ' ' + #{transportCRUD.titleMarkNotificationEnd} + ' ' + ${date.transportDate}"
                                    th:data-passengers-div="'driverPassengersForDateDiv_' + ${driver.id} + '_' + ${date.id}"
                                    th:data-driver-th="${driver.id} + '_th'"
                                    th:data-date-td="'d' + ${driver.id} + 't' + ${date.id} + '_date_td'"
                                ></i>
                            <!-- Notification icon -->
                            </div>
                            <!-- Notification icon div -->

                        </div>
                        <!-- Div for buttons to change driver status on current date -->

                        <!-- Div to show passengers assigned to transport on current date -->
                        <div class="row h-75 mt-1 ml-0">
                            <div class="col" th:id="'driverPassengersForDateDiv_' + ${driver.id} + '_' + ${date.id}">
                                <div class="row"
                                    th:if="${#lists.isEmpty(driverScreenInfo.assignedPassengerList) == false}"
                                    th:each="passenger : ${driverScreenInfo.assignedPassengerList}"
                                    th:id="'driverPassengersOnDate_' + ${driver.id} + '_' + ${date.id} + '_' + ${passenger.id}"
                                >
                                    <!-- Passenger name  -->
                                    <span
                                            th:text="${passenger.name} + ' ' + ${passenger.surname}"
                                            th:data-span-id="${driver.id}"
                                            th:data-p-span-id="${passenger.id}"
                                            th:id="'p' + ${passenger.id} + 'd' + ${driver.id} + 't' + ${date.id}">
                                    <!-- TODO when UUIDs are implemented, change the id and remove the p, d, t... -->
                                    </span>
                                </div>
                            </div>
                        </div>
                        <!-- Div to show passengers assigned to transport on current date -->

                    </div>
                    <!-- Transport Date display -->
                </td>
            </tr>
        </tbody>
    </table>

    <script src="/js/own/transportcrud/driver/TransportCrudDriverAvailabilityForDateCRUD.js" type="module"></script>
    <script src="/js/own/transportcrud/driver/notification/TransportCrudDriverNotifications.js" type="module"></script>
</div>
